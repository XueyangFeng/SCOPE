pipeline:
  dataset: webvoyager
  artifact_root: ./artifacts/webvoyager
  memory_root: ./artifacts/webvoyager/memory_store
  results_dir_template: ./artifacts/webvoyager/iter{source_iter}/rollout/run{source_run}/results
  rollout_output_dir_template: ./artifacts/webvoyager/iter{iter}/rollout/run{run}/results
  prompts:
    generator: src/scope/webvoyager/prompts/generator.txt
    update: src/scope/webvoyager/prompts/update.txt
    selector: src/scope/webvoyager/prompts/selector.txt
  llm:
    enabled: false
    model: gpt-4o-mini
    base_url: https://api.openai.com/v1
  rollout:
    webvoyager_root: ${WEBVOYAGER_ROOT:-integrations/WebVoyager}
    guided_prompt_source: src/scope/webvoyager/rollout_prompts/guided_prompt.txt
    test_file: ${WEBVOYAGER_TASK_FILE:-data/WebVoyager_trainset.jsonl}
    api_model: ${DCRL_MODEL}
    max_iter: 15
    num_workers: 4
    headless: true
    prefix_validate_replay: true

rounds:
  - iter: 0
    run: 0
    source_iter: 0
    source_run: 0
    stage: rollout
  - iter: 1
    run: 0
    source_iter: 0
    source_run: 0
    stage: all
